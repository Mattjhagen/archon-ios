name: Desktop release

on:
  push:
    branches:
      - Docs
    paths:
      - desktop/**
      - .github/workflows/desktop-release.yml
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to receive the desktop installers
        required: true
        default: desktop
        type: string

permissions:
  contents: write

jobs:
  ensure-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create the release when it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'desktop' }}
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY" || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Archon IDE desktop" --generate-notes

  build-and-upload:
    needs: ensure-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            command: npm run build:mac:universal
            files: desktop/dist/Archon-IDE.dmg
          - os: windows-latest
            command: npm run build:win
            files: desktop/dist/Archon-IDE-Setup.exe
          - os: ubuntu-latest
            command: npm run build:linux
            files: desktop/dist/Archon-IDE.AppImage desktop/dist/Archon-IDE.deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Build installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: ${{ matrix.command }}
      - name: Upload installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'desktop' }}
          FILES: ${{ matrix.files }}
        shell: bash
        run: gh release upload "$TAG" $FILES --clobber --repo "$GITHUB_REPOSITORY"
